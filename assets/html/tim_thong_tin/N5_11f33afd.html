<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひまわりセンター へやの よてい</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            color: #000;
            line-height: 1.6;
        }
        .container {
            max-width: 750px;
            margin: 2rem auto;
            background: white;
            padding: 3rem;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        ruby rt { font-size: 0.6em; color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #000;
            margin: 1.5rem 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
            font-size: 1.05rem;
        }
        th {
            background-color: #f3f4f6;
            font-weight: bold;
        }
        .ok { font-size: 1.3rem; }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="container">
    <h1 class="text-2xl font-bold text-center mb-1">ひまわりセンター</h1>
    <p class="text-center mb-4">7<ruby>月<rt>がつ</rt></ruby>の　へやの　よてい</p>

    <p class="mb-2">○ つかえます　　× つかえません</p>

    <table>
        <thead>
            <tr>
                <th></th>
                <th><ruby>月<rt>げつ</rt></ruby></th>
                <th><ruby>火<rt>か</rt></ruby></th>
                <th><ruby>水<rt>すい</rt></ruby></th>
                <th><ruby>木<rt>もく</rt></ruby></th>
                <th><ruby>金<rt>きん</rt></ruby></th>
                <th><ruby>土<rt>ど</rt></ruby></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="font-bold">あさ<br>9:00～12:00</td>
                <td class="ok">○</td>
                <td class="ok">×</td>
                <td class="ok">○</td>
                <td class="ok">○</td>
                <td class="ok">×</td>
                <td class="ok">○</td>
            </tr>
            <tr>
                <td class="font-bold">ひる<br>13:00～17:00</td>
                <td class="ok">×</td>
                <td class="ok">○</td>
                <td class="ok">○</td>
                <td class="ok">×</td>
                <td class="ok">○</td>
                <td class="ok">○</td>
            </tr>
            <tr>
                <td class="font-bold">よる<br>18:00～21:00</td>
                <td class="ok">○</td>
                <td class="ok">○</td>
                <td class="ok">×</td>
                <td class="ok">○</td>
                <td class="ok">○</td>
                <td class="ok">×</td>
            </tr>
        </tbody>
    </table>

    <p>※ <ruby>日<rt>にち</rt></ruby>ようびは　やすみです。</p>
    <p>※ 1じかん　200<ruby>円<rt>えん</rt></ruby>です。</p>
    <p class="mt-2">でんわ：03-9876-5432</p>
</div>
</body>
</html>
