<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じてんしゃの きまり</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            color: #000;
            line-height: 1.8;
        }
        .container {
            max-width: 700px;
            margin: 2rem auto;
            background: white;
            padding: 3rem;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        ruby rt { font-size: 0.6em; color: #333; }
        .rule-item {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            padding-left: 0.5rem;
        }
        .rule-num {
            background: #000;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .header-box {
            border: 3px solid #000;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="container">
    <div class="header-box">
        <h1 class="text-2xl font-bold">じてんしゃの　きまり</h1>
        <p>さくらアパート</p>
    </div>

    <p class="mb-4">じてんしゃは　<ruby>下<rt>した</rt></ruby>の　きまりを　まもって　ください。</p>

    <div class="rule-item">
        <div class="rule-num">1</div>
        <p>じてんしゃは　1かいの　じてんしゃの　ところに　おいて　ください。</p>
    </div>
    <div class="rule-item">
        <div class="rule-num">2</div>
        <p>かぎを　かけて　ください。</p>
    </div>
    <div class="rule-item">
        <div class="rule-num">3</div>
        <p>1つの　へやに　じてんしゃは　2つまでです。</p>
    </div>
    <div class="rule-item">
        <div class="rule-num">4</div>
        <p>あたらしい　じてんしゃを　おくときは、じむしょに　いって　ください。</p>
    </div>
    <div class="rule-item">
        <div class="rule-num">5</div>
        <p>つかわない　じてんしゃは　3<ruby>月<rt>がつ</rt></ruby>までに　もって　かえって　ください。</p>
    </div>

    <p class="mt-4 text-right">さくらアパート　じむしょ</p>
</div>
</body>
</html>
