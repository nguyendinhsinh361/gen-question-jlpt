<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng giờ tàu và xe buýt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 2rem 1rem;
        }

        /* Hiệu ứng tờ giấy có góc cuộn */
        .paper-sheet {
            max-width: 700px;
            margin: 0 auto 3rem auto;
            background: white;
            padding: 3rem;
            border: 1px solid #d1d5db;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .paper-sheet::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, transparent 50%, #e5e7eb 50%);
            border-top: 1px solid #d1d5db;
            border-left: 1px solid #d1d5db;
        }

        ruby rt {
            font-size: 0.6em;
            color: #4b5563;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #333;
            margin: 1.5rem 0;
        }

        th, td {
            border: 1px solid #333;
            padding: 0.75rem;
            text-align: center;
            font-size: 1.1rem;
        }

        .price-section {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 1.5rem;
            line-height: 2;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .vehicle-title {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <!-- Tờ 1: Bảng giờ Tàu -->
    <div class="paper-sheet">
        <div class="header-section">
            <!-- Icon tàu Fuji -->
            <div class="w-32 flex flex-col items-center">
                <svg viewBox="0 0 100 60" class="w-24 h-16">
                    <rect x="10" y="10" width="80" height="35" rx="5" fill="#e5e7eb" stroke="black" stroke-width="2"/>
                    <rect x="15" y="15" width="20" height="15" fill="white" stroke="black"/>
                    <rect x="40" y="15" width="20" height="15" fill="white" stroke="black"/>
                    <rect x="65" y="15" width="20" height="15" fill="white" stroke="black"/>
                    <rect x="35" y="32" width="30" height="10" fill="white" stroke="black"/>
                    <text x="50" y="40" text-anchor="middle" font-size="8" font-weight="bold">ふじ</text>
                    <circle cx="20" cy="50" r="5" fill="black"/>
                    <circle cx="80" cy="50" r="5" fill="black"/>
                </svg>
            </div>

            <div class="vehicle-title">
                <ruby>電車<rt>でんしゃ</rt></ruby>の <ruby>時間<rt>じかん</rt></ruby>
            </div>

            <!-- Icon tàu Sakura -->
            <div class="w-32 flex flex-col items-center">
                <svg viewBox="0 0 100 60" class="w-24 h-16">
                    <path d="M10 45 L80 45 Q100 45 90 20 L70 20 L10 20 Z" fill="#e5e7eb" stroke="black" stroke-width="2"/>
                    <rect x="20" y="25" width="15" height="10" fill="white" stroke="black"/>
                    <rect x="40" y="25" width="15" height="10" fill="white" stroke="black"/>
                    <rect x="60" y="25" width="15" height="10" fill="white" stroke="black"/>
                    <rect x="78" y="35" width="12" height="6" fill="#fbcfe8" stroke="black"/>
                    <text x="84" y="40" text-anchor="middle" font-size="5" font-weight="bold">さくら</text>
                    <line x1="10" y1="45" x2="90" y2="45" stroke="black" stroke-width="3"/>
                </svg>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th><ruby>電車<rt>でんしゃ</rt></ruby></th>
                    <th colspan="2">
                        <ruby>東京駅<rt>とうきょうえき</rt></ruby> 
                        <span class="mx-4">⇨</span> 
                        <ruby>中川駅<rt>なかがわえき</rt></ruby>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>ふじ 1</td>
                    <td>8 : 20</td>
                    <td>10 : 20</td>
                </tr>
                <tr>
                    <td>さくら 1</td>
                    <td>9 : 10</td>
                    <td>10 : 10</td>
                </tr>
                <tr>
                    <td>ふじ 3</td>
                    <td>9 : 20</td>
                    <td>11 : 20</td>
                </tr>
                <tr>
                    <td>さくら 3</td>
                    <td>10 : 10</td>
                    <td>11 : 10</td>
                </tr>
            </tbody>
        </table>

        <div class="price-section">
            <p>(お<ruby>金<rt>かね</rt></ruby>) &nbsp; ふ &nbsp; じ : 3,000 <ruby>円<rt>えん</rt></ruby></p>
            <p>さくら : 5,000 <ruby>円<rt>えん</rt></ruby></p>
        </div>
    </div>

    <!-- Tờ 2: Bảng giờ Xe buýt -->
    <div class="paper-sheet">
        <div class="header-section">
            <div class="w-32">
                <!-- Icon Xe buýt -->
                <svg viewBox="0 0 100 60" class="w-24 h-16">
                    <rect x="10" y="15" width="80" height="30" rx="3" fill="#f3f4f6" stroke="black" stroke-width="2"/>
                    <rect x="15" y="20" width="15" height="12" fill="white" stroke="black"/>
                    <rect x="35" y="20" width="15" height="12" fill="white" stroke="black"/>
                    <rect x="55" y="20" width="15" height="12" fill="white" stroke="black"/>
                    <rect x="75" y="20" width="12" height="12" fill="white" stroke="black"/>
                    <circle cx="25" cy="45" r="5" fill="black"/>
                    <circle cx="75" cy="45" r="5" fill="black"/>
                </svg>
            </div>
            <div class="vehicle-title">
                バスの <ruby>時間<rt>じかん</rt></ruby>
            </div>
            <div class="w-32"></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th colspan="2">
                        <ruby>中川駅<rt>なかがわえき</rt></ruby> 
                        <span class="mx-8">⇨</span> 
                        いちご<ruby>山<rt>やま</rt></ruby>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>10 : 30</td>
                    <td>11 : 00</td>
                </tr>
                <tr>
                    <td>11 : 30</td>
                    <td>12 : 00</td>
                </tr>
            </tbody>
        </table>

        <div class="price-section">
            <p>(お<ruby>金<rt>かね</rt></ruby>) &nbsp; 800 <ruby>円<rt>えん</rt></ruby></p>
        </div>
    </div>

</body>
</html>
